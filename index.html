function newCard(k){const d=DEFS[k];return{id:uid++,key:k,attr:d.attr,rarity:d.rarity||null,spell:!!d.spell,name:d.name,level:d.level,power:d.power,text:d.text,pursuit:d.pursuit||0,development:d.development||0,tempPursuit:0,enteredTurn:-999,pioneerBuff:false,activeUsedRound:-1,activeUseCount:0,entryPowerBuff:0,tempWall:0,tempPowerMod:0,tempLevelMod:0,slot:null}}
function makeDeck(attr){const a=[];for(const[k,n]of Object.entries(DECKS[attr]))for(let i=0;i<n;i++)a.push(newCard(k));shuffle(a);return a}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(__rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
let __runtimeDeckOverrides={human:null,cpu:null};
function makeDeckFromSpec(spec){
  const a=[];
  for(const[k,n]of Object.entries(spec||{})){
    if(!DEFS[k])throw new Error(`存在しないカードIDです: ${k}`);
    for(let i=0;i<n;i++)a.push(newCard(k));
  }
  shuffle(a);
  return a;
}

  const ov=__runtimeDeckOverrides[side];
  return{
    name,
    attr,
    deckName:ov?.label||ATTR_NAME[attr]||attr,
    deck:ov?.spec?makeDeckFromSpec(ov.spec):makeDeck(attr),
    hand:[],field:[],pursuit:[],development:[],nutrient:[],grave:[],stars:0
  }
}
function other(s){return s==='human'?'cpu':'human'}
function isManualSide(s){if(state&&state.mode==='cpuvs')return false;return s==='human'||(state&&state.mode==='pvp')}
function baseLimitForLevel(lv){if(lv<=0)return 0;if(lv===1)return 2;if(lv===2)return 4;if(lv===3)return 7;return 10}
function roundLimits(){const max=state?.fieldMaxLevel??1;return{max,cap:baseLimitForLevel(max)}}
function fieldLevelValue(c){let v=c.level;if(['onobua','whitetiger'].includes(c.key))v+=1;if(c.key==='gorilla')v+=2;v+=c.tempLevelMod||0;return v}
function fieldLevel(s){return state.players[s].field.reduce((x,c)=>x+fieldLevelValue(c),0)}
function scienceLimitPenalty(s){const op=state.players[other(s)];return op.field.reduce((n,c)=>n+(c.key==='spacewolf'?1:c.key==='sagittarius'?2:0),0)+(state.tempLimitPenalty?.[s]||0)}
function developmentPower(s){return state.players[s].development.reduce((n,x)=>n+(x.value||0),0)}
function fieldCap(s){const base=roundLimits().cap;return Math.max(0,base+developmentPower(s)-scienceLimitPenalty(s))}
function totalFieldLevel(){return fieldLevel('human')+fieldLevel('cpu')}
function monsterAtSlot(s,slot){return state.players[s].field.find(c=>c.slot===slot)||null}
function availableSlots(s){const out=[];for(let i=0;i<3;i++)if(!monsterAtSlot(s,i))out.push(i);return out}
function emptyFieldCount(){return 6-state.players.human.field.length-state.players.cpu.field.length}
function slotName(i){return ['左','中央','右'][i]||String(i+1)}
function hasScienceRaritySet(s){const f=state.players[s].field;return ['R','SR','SSR'].every(r=>f.some(c=>c.rarity===r))}
function pursuitPower(s){return state.players[s].pursuit.reduce((n,x)=>n+(x.value||0),0)}
function powerOf(s,c){const p=state.players[s],f=p.field;let v=c.power+(c.entryPowerBuff||0)+(c.tempPowerMod||0);if(c.key==='doratch'&&f.some(x=>x.level>=3))v++;if(c.key==='lizard')v+=Math.max(0,f.length-1);if(c.key==='spinner'&&c.pioneerBuff)v++;if(c.key==='slum'&&p.grave.length>=15)v+=2;if(c.key==='serpent')v+=Math.floor(p.hand.length/2);if(c.key==='bigpanda'&&fieldLevel(s)>=12)v+=2;if(c.key==='jungleking'&&totalFieldLevel()>=20)v+=2;if(c.key==='deathpierrot')v+=emptyFieldCount();if(c.key==='soldier')v+=f.filter(x=>x.key==='cheerleader').length;if(c.key==='riku')v+=Math.floor(p.grave.filter(x=>x.key==='soldier').length/3);if(c.key==='rassassin'&&f.some(x=>x.rarity==='SR'||x.rarity==='SSR'))v+=1;if(c.key==='ssrgunner'&&hasScienceRaritySet(s))v+=4;return Math.max(0,v)}
function fieldPower(s){return state.players[s].field.reduce((x,c)=>x+powerOf(s,c),0)+pursuitPower(s)}
function wallValue(s){const p=state.players[s];let w=Math.floor(p.nutrient.length/3);for(const c of p.field){if(c.key==='isogin'&&p.hand.length>=6)w+=3;if(c.key==='penguin')w+=2;if(c.key==='marilyn')w+=2;if(c.key==='kuu')w+=3;if(c.key==='srgolem')w+=3;if(c.key==='ballman'&&hasScienceRaritySet(s))w+=2;w+=c.tempWall||0}return w}
function canEnter(s,c){const lim=roundLimits(),p=state.players[s];if(state.frostNoSummonSide===s)return false;if(state.frostLv2BlockedSide===s&&c.level<=2)return false;if(c.key==='whitewolf'&&!state.returnedThisRound[s])return false;if(c.key==='yasha'&&p.field.length>0)return false;if(c.key!=='yasha'&&p.field.some(x=>x.key==='yasha'))return false;const remaining=fieldCap(s)-fieldLevel(s);return c.level<=lim.max&&availableSlots(s).length>0&&c.level<=remaining}
function canSummonFromHand(s,c){if(state.lowLvBlockedSide===s&&c.level<=3)return false;return canEnter(s,c)}

function resetRoundCardState(c){c.pioneerBuff=false;c.enteredTurn=-999;c.activeUsedRound=-1;c.activeUseCount=0;c.tempWall=0;c.tempPowerMod=0;c.tempLevelMod=0;c.tempPursuit=0;c.slot=null}

async function ruleSendToGrave(s,id,reason='リミット超過'){const p=state.players[s],c=removeById(p.field,id);if(!c)return null;resetRoundCardState(c);p.grave.push(c);addLog(`${p.name}の${c.name}を${reason}のルール処理で墓地に置いた（破壊ではない）。`);render();return c}
async function enforceLimit(s,reason='リミット超過'){const p=state.players[s];let guard=0;while(fieldLevel(s)>fieldCap(s)&&p.field.length&&guard++<12){addLog(`${p.name}はリミット超過：場Lv${fieldLevel(s)} / リミット${fieldCap(s)}。`);let id;if(isManualSide(s))id=await chooseCard('リミット超過',`場Lv${fieldLevel(s)}をリミット${fieldCap(s)}以下にするまで、墓地に置くモンスターを選択してください。`,p.field,s,false);else id=cpuLimitSacrifice(s).id;await ruleSendToGrave(s,id,reason)}return fieldLevel(s)<=fieldCap(s)}

function trainingCardSnapshot(side,c){return{id:c.id,key:c.key,name:c.name,level:c.level,base_power:c.power,current_power:side?powerOf(side,c):c.power,slot:c.slot??null,text:c.text||'',spell:!!c.spell,activeUsedRound:c.activeUsedRound??-1,activeUseCount:c.activeUseCount||0}}
function projectedHandPower(side,c){
  const p=state.players[side],f=p.field;
  let v=c.power;
  if(c.key==='doratch'&&f.some(x=>x.level>=3))v++;
  if(c.key==='lizard')v+=f.length;
  if(c.key==='slum'&&p.grave.length>=15)v+=2;
  if(c.key==='serpent')v+=Math.floor(Math.max(0,p.hand.length-1)/2);
  const projectedFieldLevel=fieldLevel(side)+fieldLevelValue(c);
  if(c.key==='bigpanda'&&projectedFieldLevel>=12)v+=2;
  const projectedTotalLevel=totalFieldLevel()+fieldLevelValue(c);
  if(c.key==='jungleking'&&projectedTotalLevel>=20)v+=2;
  if(c.key==='deathpierrot')v+=Math.max(0,emptyFieldCount()-1);
  if(c.key==='soldier')v+=f.filter(x=>x.key==='cheerleader').length;
  if(c.key==='riku')v+=Math.floor(p.grave.filter(x=>x.key==='soldier').length/3);
  if(c.key==='rassassin'&&(f.some(x=>x.rarity==='SR'||x.rarity==='SSR')||c.rarity==='SR'||c.rarity==='SSR'))v+=1;
  if(c.key==='ssrgunner'){const fs=[...f,c];if(['R','SR','SSR'].every(r=>fs.some(x=>x.rarity===r)))v+=4}
  return Math.max(0,v);
}

function removeById(a,id){const i=a.findIndex(x=>x.id===id);return i>=0?a.splice(i,1)[0]:null}
function addLog(t){if(trainingCurrentTurn&&!trainingCurrentTurn.finished)trainingCurrentTurn.events.push(t);else if(trainingLog)trainingLog.game_events.push(t);__publicLogs.push(String(t));if(__publicLogs.length>300)__publicLogs.splice(0,__publicLogs.length-300);const d=document.createElement('div');d.textContent=t;$('log').prepend(d)}
function stars(n){return'★'.repeat(n)+'☆'.repeat(Math.max(0,3-n))}
function renderCard(c,s){const d=document.createElement('div');d.className=`card lv${c.level} ${c.attr}`+(c.enteredTurn===state.turnToken?' entered':'');const p=powerOf(s,c),w=(c.key==='isogin'&&state.players[s].hand.length>=6?3:0)+(c.key==='penguin'?2:0)+(c.key==='marilyn'?2:0)+(c.key==='kuu'?3:0)+(c.key==='srgolem'?3:0)+(c.key==='ballman'&&hasScienceRaritySet(s)?2:0)+(c.tempWall||0);d.innerHTML=`<div class="name">${c.name}</div><div class="lv">Lv${c.level}</div><div class="txt">${c.text}</div>${['antsoldier','yasha'].includes(c.key)&&(c.activeUseCount||0)>0?`<div class="used">起) ${c.activeUseCount}/2</div>`:(c.activeUsedRound===state.round&&c.key!=='kai'?'<div class="used">起) 使用済</div>':'')}${w?`<div class="used">防壁 ${w}</div>`:''}<div class="pow">POWER <strong>${p}</strong>${p!==c.power?` <small>(${c.power})</small>`:''}</div>`;return d}
function currentSide(){if(!state)return null;const seq=[state.starter,other(state.starter),state.starter,other(state.starter),state.starter,other(state.starter)];return seq[state.turnIndex]||null}
function render(){if(!state)return;const lim=roundLimits();$('round').textContent=state.round;$('turnInfo').textContent=state.gameOver?'-':`${state.turnIndex+1}/6`;$('maxLv').textContent=lim.max;$('lvCap').textContent=lim.cap;for(const s of['human','cpu']){const p=state.players[s];$(`${s}Attr`).textContent=ATTR_NAME[p.attr];$(`${s}Stars`).textContent=stars(p.stars);$(`${s}Power`).textContent=fieldPower(s);$(`${s}FieldLv`).textContent=`${fieldLevel(s)}/${fieldCap(s)}`;$(`${s}DeckCount`).textContent=p.deck.length;$(`${s}GraveCount`).textContent=p.grave.length;$(`${s}SpellCount`).textContent=state.spellCount?.[s]||0;const f=$(`${s}Field`);f.innerHTML='';f.classList.add('fieldSlots');for(let slot=0;slot<3;slot++){const box=document.createElement('div'),card=monsterAtSlot(s,slot);box.className='fieldSlot';const label=document.createElement('div');label.className='slotLabel';label.textContent=slotName(slot);box.appendChild(label);if(card)box.appendChild(renderCard(card,s));else{box.classList.add('empty');const x=document.createElement('div');x.textContent='空き';box.appendChild(x)}f.appendChild(box)}const pz=$(`${s}Pursuit`);pz.innerHTML='';for(const x of p.pursuit){const chip=document.createElement('div');chip.className='pursuitChip';chip.textContent=`${x.card.name} +${x.value}`;pz.appendChild(chip)}const dz=$(`${s}Development`);dz.innerHTML='';for(const x of p.development){const chip=document.createElement('div');chip.className='developmentChip';chip.textContent=`${x.card.name} +${x.value}`;dz.appendChild(chip)}$(`${s}NutrientCount`).textContent=`${p.nutrient.length}${p.nutrient.length>=3?`（防壁${Math.floor(p.nutrient.length/3)}）`:''}`;const nz=$(`${s}Nutrient`);nz.innerHTML='';const shown=Math.min(10,p.nutrient.length);for(let i=0;i<shown;i++){const chip=document.createElement('div');chip.className='nutrientChip';chip.title='裏向きの養分';nz.appendChild(chip)}if(p.nutrient.length>shown){const more=document.createElement('span');more.className='nutrientMore';more.textContent=`+${p.nutrient.length-shown}`;nz.appendChild(more)}}$('cpuHandCount').textContent=state.players.cpu.hand.length;$('humanName').textContent=state.players.human.name;$('cpuName').textContent=state.players.cpu.name;const hh=$('humanHand');hh.innerHTML='';state.players.human.hand.forEach(c=>hh.appendChild(renderCard(c,'human')));const ch=$('cpuHand');ch.innerHTML='';if(state.mode==='pvp'||state.mode==='cpuvs'){state.players.cpu.hand.forEach(c=>ch.appendChild(renderCard(c,'cpu')))}else{for(let i=0;i<state.players.cpu.hand.length;i++){const e=document.createElement('div');e.className='card hidden';e.textContent='CARD';ch.appendChild(e)}}$('humanPanel').classList.toggle('active',!state.gameOver&&currentSide()==='human');$('cpuPanel').classList.toggle('active',!state.gameOver&&currentSide()==='cpu');renderActions()}
function setStatus(t){$('status').textContent=t}
async function choose(title,desc,opts){if(__uiChoose)return await __uiChoose({title,desc:desc||'',opts});const prevBusy=state.busy;state.busy=true;render();$('modalTitle').textContent=title;$('modalDesc').textContent=desc||'';const box=$('modalChoices');box.innerHTML='';$('modal').classList.add('open');return await new Promise(resolve=>{for(const o of opts){const b=document.createElement('button');b.className='choice '+(o.cls||'');b.innerHTML=`${o.label}${o.sub?`<small>${o.sub}</small>`:''}`;b.onclick=()=>{$('modal').classList.remove('open');state.busy=prevBusy;render();resolve(o.value)};box.appendChild(b)}})}
async function chooseCard(title,desc,cards,side=null,cancel=false){const opts=cards.map(c=>({label:`${c.name} (Lv${c.level}/P${side?powerOf(side,c):c.power})`,sub:c.text,value:c.id}));if(cancel)opts.push({label:'選ばない',value:null,cls:'cancel'});return await choose(title,desc,opts)}
async function chooseWithCards(title,desc,opts,cards=[]){if(__uiChoose)return await __uiChoose({title,desc:desc||'',opts,cards:cards.map(c=>({...c}))});return await choose(title,desc,opts)}
async function inspectGrave(s){if(!state||(state.busy&&!(state.mode==='cpuvs'&&cpuVsPaused)))return;const g=state.players[s].grave;if(!g.length){await choose(`${state.players[s].name}の墓地`,'墓地は空です。',[{label:'閉じる',value:null}]);return}const opts=g.map(c=>({label:`${c.name} Lv${c.level}/P${c.power}`,sub:c.text,value:c.id}));opts.push({label:'閉じる',value:null,cls:'cancel'});await choose(`${state.players[s].name}の墓地`,`計${g.length}枚`,opts)}
async function discardCards(s,n,exact=false){const p=state.players[s];if(exact&&p.hand.length<n){addLog(`${p.name}は手札${n}枚を捨てられないため、効果は何も起こらない。`);return false}for(let i=0;i<n&&p.hand.length;i++){let id;if(isManualSide(s))id=await chooseCard('捨てるカードを選択',`${i+1}/${n}枚目`,p.hand,null,false);else id=cpuWorstHandCard(s).id;const c=removeById(p.hand,id);p.grave.push(c);addLog(`${p.name}は${c.name}を捨てた。`);render()}return true}
async function discardFiltered(s,n,filter,label='捨てるカードを選択'){const p=state.players[s];for(let i=0;i<n;i++){const eligible=p.hand.filter(filter);if(!eligible.length)return false;let id=isManualSide(s)?await chooseCard(label,`${i+1}/${n}枚目`,eligible,null,false):[...eligible].sort((a,b)=>cpuDiscardValue(s,a)-cpuDiscardValue(s,b))[0].id;const c=removeById(p.hand,id);if(c){p.grave.push(c);addLog(`${p.name}は${c.name}を捨てた。`);render()}}return true}
async function drawOne(s,reason='ドロー'){const p=state.players[s];if(p.deck.length===0){endGame(other(s),`${p.name}は${reason}でカードを引けずLO。`);return null}const c=p.deck.shift();p.hand.push(c);addLog(`${p.name}がカードを1枚引いた。`);render();return c}
async function drawN(s,n,reason='効果'){for(let i=0;i<n;i++){const c=await drawOne(s,reason);if(!c||state.gameOver)return false}return true}
async function onDeckToGrave(s,c){const p=state.players[s];if(c.key==='ponkotsu'&&canEnter(s,c)){let yes=isManualSide(s)?await choose('ポンコツゾンビ','デッキから墓地に置かれました。場に出しますか？',[{label:'場に出す',value:true,cls:'good'},{label:'墓地に残す',value:false,cls:'cancel'}]):true;if(yes){const x=removeById(p.grave,c.id);if(x&&canEnter(s,x))await enterField(s,x)}}if(state.gameOver)return;if(c.key==='yamanba'){const os=other(s),op=state.players[os];if(op.hand.length){addLog(`${p.name}のヤマンバ効果：${op.name}は手札を1枚捨てる。`);await discardCards(os,1,false)}}}
async function mill(s,n,label='効果'){const p=state.players[s],m=[];for(let i=0;i<n;i++){if(!p.deck.length)break;const c=p.deck.shift();p.grave.push(c);m.push(c);addLog(`${p.name}：${label}で${c.name}をデッキから墓地へ。`);render()}if(m.length)await uiNotify({kind:'cards',title:`${p.name}：${label}`,desc:'デッキから墓地に置かれたカード',cards:m.map(x=>({...x}))});for(const c of m){await onDeckToGrave(s,c);if(state.gameOver)break}return m}


async function chargeNutrient(s,n,label='養分チャージ'){const p=state.players[s],m=Math.min(n,p.deck.length);for(let i=0;i<m;i++)p.nutrient.push(p.deck.shift());addLog(`${p.name}は${label}で「養分」を${m}チャージ${m<n?`（山札不足のため指定${n}枚中${m}枚）`:''}。`);render();return m}
function canPayNutrient(s,n){return state.players[s].nutrient.length>=n}
async function payNutrient(s,n,label='養分コスト'){const p=state.players[s];if(p.nutrient.length<n)return false;const paid=p.nutrient.splice(0,n);shuffle(paid);p.deck.push(...paid);addLog(`${p.name}は${label}として「養分」${n}を消費し、シャッフルしてデッキの一番下へ戻した。`);render();return true}
async function aibiRecoverNutrient(s){const p=state.players[s];if(!p.nutrient.length)return;let id=null;if(isManualSide(s))id=await chooseCard('アイビ 出)',`養分${p.nutrient.length}枚を確認。1枚まで手札に加えられます。`,p.nutrient,null,true);else{id=[...p.nutrient].sort((a,b)=>cpuCardValue(s,b)-cpuCardValue(s,a))[0]?.id??null}if(id!=null){const x=removeById(p.nutrient,id);if(x){p.hand.push(x);addLog(`${p.name}はアイビで養分から${x.name}を手札に加えた。`)}}else addLog(`${p.name}はアイビで養分を確認し、手札には加えなかった。`);render()}


async function chooseEntrySlot(s,c){const slots=availableSlots(s);if(!slots.length)return null;if(__forcedEntrySlot!=null){const forced=__forcedEntrySlot;__forcedEntrySlot=null;if(slots.includes(forced))return forced}if(slots.length===1)return slots[0];if(!isManualSide(s))return cpuChooseEntrySlot(s,c,slots);return await choose('場の位置を選択',`${c.name}を出す位置を選んでください。同じ位置が「正面」です。`,slots.map(i=>({label:slotName(i),value:i})))}
async function handleOpponentEnterTriggers(s,c){const os=other(s),op=state.players[os],p=state.players[s];if(c.level>=3){for(const source of [...op.field].filter(x=>x.key==='pinocchio')){addLog(`${op.name}のピノッキオ：相手がLv${c.level}の${c.name}を場に出したため養分1チャージ。`);await chargeNutrient(os,1,'ピノッキオの常)')}}for(const source of [...op.field]){if(source.slot!==c.slot)continue;if(source.key==='whitebat'){if(p.hand.length){addLog(`${op.name}のホワイトバット：正面に${c.name}が登場したため${p.name}は手札1枚を捨てる。`);await discardCards(s,1,false)}else addLog(`${op.name}のホワイトバット：${p.name}の手札がないため何も起こらない。`)}else if(source.key==='shadow'){c.tempPowerMod=(c.tempPowerMod||0)-1;addLog(`${op.name}のシャドー：${c.name}をP-1（このラウンド）。`);render()}else if(source.key==='shinigami'){c.tempPowerMod=(c.tempPowerMod||0)-4;addLog(`${op.name}のシニガミ：${c.name}をP-4（このラウンド）。`);render()}}}


async function revealSoldiersToHand(s,n,label){const p=state.players[s],revealed=p.deck.splice(0,Math.min(n,p.deck.length));if(!revealed.length)return;addLog(`${p.name}の${label}：${revealed.map(x=>x.name).join(' / ')} を公開。`);await uiNotify({kind:'cards',title:`${p.name}：${label}`,desc:'デッキから公開したカード',cards:revealed.map(x=>({...x}))});for(const x of revealed){if(x.key==='soldier'){p.hand.push(x);addLog(`${p.name}は兵士を手札に加えた。`)}else p.deck.push(x)}shuffle(p.deck);render()}
async function commanderDeploy(s){const p=state.players[s],revealed=p.deck.splice(0,Math.min(3,p.deck.length));if(!revealed.length)return;addLog(`${p.name}の指揮官「出)」：${revealed.map(x=>x.name).join(' / ')} を公開。`);await uiNotify({kind:'cards',title:'指揮官 出)',desc:'デッキから公開したカード',cards:revealed.map(x=>({...x}))});const soldiers=revealed.filter(x=>x.key==='soldier'),rest=revealed.filter(x=>x.key!=='soldier');for(const x of soldiers){if(canEnter(s,x)){await enterField(s,x);if(state.gameOver)return}else rest.push(x)}for(const x of rest)p.deck.push(x);shuffle(p.deck);render()}
async function rikuDeploy(s){const p=state.players[s],revealed=p.deck.splice(0,Math.min(5,p.deck.length));if(!revealed.length)return;addLog(`${p.name}の勇者リク「出)」：${revealed.map(x=>x.name).join(' / ')} を公開。`);await uiNotify({kind:'cards',title:'勇者リク 出)',desc:'デッキから公開したカード',cards:revealed.map(x=>({...x}))});const rest=[];for(const x of revealed){if(x.key==='soldier'&&canEnter(s,x)){await enterField(s,x);if(state.gameOver)return}else rest.push(x)}for(const x of rest)p.deck.push(x);shuffle(p.deck);render()}


function enteredOnPreviousOpponentTurn(s,c){return !!c&&state.lastCompletedTurnSide===other(s)&&c.enteredTurn===state.lastCompletedTurnToken}
async function resolveImmediate(s,c){const os=other(s),facing=monsterAtSlot(os,c.slot);if(!facing||!enteredOnPreviousOpponentTurn(s,facing))return;if(c.key==='assassin'){facing.tempPowerMod=(facing.tempPowerMod||0)-3;addLog(`${state.players[s].name}のアサシン「即応」：正面の${facing.name}をP-3（このラウンド）。`);render()}else if(c.key==='murasame'&&powerOf(os,facing)>=5){c.tempPowerMod=(c.tempPowerMod||0)+2;addLog(`${state.players[s].name}の剣豪ムラサメ「即応」：正面の${facing.name}がP5以上のため、このラウンドP+2。`);render()}}

async function enterField(s,c){if(!canEnter(s,c))return false;const slot=await chooseEntrySlot(s,c);if(slot==null)return false;trainingRecordDecision('entry',{side:s,card:c.key,card_name:c.name,slot});const p=state.players[s],first=state.players.human.field.length===0&&state.players.cpu.field.length===0;state.roundHasMonster=true;c.enteredTurn=state.turnToken;c.pioneerBuff=false;c.activeUsedRound=-1;c.activeUseCount=0;c.entryPowerBuff=0;c.tempWall=0;c.tempPowerMod=0;c.tempLevelMod=0;c.slot=slot;p.field.push(c);addLog(`${p.name}が${c.name}を${slotName(slot)}に出した。`);render();await enforceAllLimits(`${c.name}の登場によるリミット変化`);if(state.gameOver)return true;await handleOpponentEnterTriggers(s,c);if(state.gameOver)return true;await resolveImmediate(s,c);if(state.gameOver)return true;

 else if(c.key==='king'){while(p.hand.length){const x=p.hand.pop();p.grave.push(x)}addLog(`${p.name}の龍王「出)」：手札をすべて捨てた。`);render()}
 else if(c.key==='mohawk'){const ok=await drawN(s,1,'ワルモヒカンの出)');if(ok&&!state.gameOver&&p.hand.length)await discardCards(s,1,false)}
 else if(c.key==='hammer'){await mill(s,2,'ハンマーオヤジ')}
 else if(c.key==='hecate'){await mill(s,1,'ヘカテー');if(!state.gameOver){const e=p.grave.filter(x=>x.attr==='underdog');if(e.length){let id=isManualSide(s)?await chooseCard('ヘカテー 出)','墓地のアンダードッグを1枚まで手札に加える',e,null,true):cpuFrostSpellRecoverChoice(s,e)?.id??null;if(id!=null){const x=removeById(p.grave,id);if(x){p.hand.push(x);addLog(`${p.name}はヘカテーで${x.name}を手札に加えた。`)}}}}}

 else if(c.key==='boss'){const n=p.hand.length;while(p.hand.length){p.grave.push(p.hand.pop())}addLog(`${p.name}のボス「出)」：手札${n}枚を捨て、${n}枚引く。`);render();if(n)await drawN(s,n,'ボスの出)')}
 else if(c.key==='tsukuyomi'){const e=p.grave.filter(x=>x.attr==='underdog');if(e.length>=20){let yes=isManualSide(s)?await choose('ツクヨミ 出)','墓地20枚をデッキに戻して、相手の☆を1減らしますか？',[{label:'発動する',value:true,cls:'good'},{label:'発動しない',value:false,cls:'cancel'}]):state.players[other(s)].stars>0;if(yes)await resolveTsukuyomi(s)}}
 else if(c.key==='bluecrab'){if(p.hand.length>=6){c.tempWall=(c.tempWall||0)+1;addLog(`${p.name}のアオガニ「出)」：手札6枚以上のため「防壁」①。`)}}
 else if(c.key==='clione'){const ok=await drawN(s,2,'クリオネの出)');if(ok&&!state.gameOver&&p.hand.length)await discardCards(s,1,false)}

 else if(c.key==='aquamadam'){const n=state.players[other(s)].stars;if(n){addLog(`${p.name}のアクアマダム「出)」：相手の☆${n}個ぶんドロー。`);await drawN(s,n,'アクアマダムの出)')}}

async function useActive(s,c){trainingRecordDecision('active',{side:s,card:c.key,card_name:c.name,continuous:['hatbird','kai','manto','soldier'].includes(c.key)});if(!['kai','yasha','antsoldier'].includes(c.key))c.activeUsedRound=state.round;if(c.key==='hatbird')return await useHatbird(s,c);if(c.key==='tokage')return await useTokage(s,c);if(c.key==='kill')return await useKill(s,c);if(c.key==='heavy')return await useHeavyDragon(s,c);if(c.key==='hell')return await useHell(s,c);if(c.key==='captain')return await useCaptain(s,c);if(c.key==='jelly'||c.key==='hermit')return await useOceanDraw(s,c);if(c.key==='gunturtle')return await useGunTurtle(s,c);if(c.key==='kai')return await useKai(s,c);if(c.key==='angel')return await useAngel(s,c);if(c.key==='mike')return await useMike(s,c);if(c.key==='switchmouse')return await useSwitchMouse(s,c);if(c.key==='shovelcat')return await useShovelCat(s,c);if(c.key==='manto')return await useManto(s,c);if(c.key==='hitotsume')return await useHitotsume(s,c);if(c.key==='soldier')return await useHumanSoldier(s,c);if(c.key==='priestgunner')return await usePriestGunner(s,c);if(c.key==='hidaruma')return await useHidaruma(s,c);if(c.key==='yasha')return await useYasha(s,c);if(c.key==='srroller')return await useSRRoller(s,c);if(c.key==='darkdragon')return await useDarkDragon(s,c);if(c.key==='antsoldier')return await useAntSoldier(s,c);if(c.key==='propellerbeetle')return await usePropellerBeetle(s,c);if(c.key==='juri')return await useJuri(s,c)}

function canCastSpell(s,c){
  if(!c||!c.spell||c.level>roundLimits().max)return false;
  const p=state.players[s],op=state.players[other(s)];
  if(!p.hand.some(x=>x.id===c.id))return false;
  if(c.key==='miniwitch')return p.field.length>0;
  if(c.key==='magicmaster'){
    const x=(state.spellCount?.[s]||0)+1;
    return op.field.some(m=>m.level<=x);
  }
  return true;
}

      addLog(`${p.name}の${target.name}はミニウィッチの呪文でこのラウンドP+1。`);

  }
  if(spell.key==='magicaldraw'){
    const ok=await drawN(s,2,'マジカルドローの呪文');

    return true;
  }

    const x=count,targets=op.field.filter(m=>m.level<=x);

        :cpuBestDestroy(os,targets).id;

    }
    addLog(`${p.name}のマジックマスター「呪文」によりターンを終了する。`);
    render();
    return 'end-turn';
  }
  return true;
}
async function manualSpell(s=currentSide()){

  const id=await chooseCard('「呪文」を唱える',`現在の場Lvは${roundLimits().max}。使用する呪文を選択してください。`,spells,null,true);
  if(id==null){render();return}
  state.busy=true;render();

  state.busy=false;render();
  if(result==='end-turn'&&!state.gameOver)await finishTurn();

  rebuild('cpu',

  }

function parseDeckCode(code){
  const catalog=engine.getCardCatalog();
  const known=new Map(catalog.map(c=>[c.key,c]));
  const raw=String(code||'').trim();
  if(!raw)throw new Error('デッキコードを入力してください。');
  const tokens=raw.split(/[\s,、]+/).map(x=>x.trim()).filter(Boolean);
  const deck={};
  for(const token of tokens){
    const m=token.match(/^([A-Za-z0-9_-]+)\s*[:：x×]\s*(\d+)$/);
    if(!m)throw new Error(`形式が不正です: ${token}（例 researcher:3）`);
    const id=m[1],count=Number(m[2]);
    if(!known.has(id))throw new Error(`存在しないカードIDです: ${id}`);
    if(!Number.isInteger(count)||count<1)throw new Error(`枚数が不正です: ${token}`);
    deck[id]=(deck[id]||0)+count;
    if(deck[id]>3)throw new Error(`${id} が3枚を超えています（${deck[id]}枚）。`);
  }
  const total=Object.values(deck).reduce((a,b)=>a+b,0);
  if(total!==30)throw new Error(`デッキは30枚必要です。現在 ${total}枚です。`);

    if(attr)counts[attr]=(counts[attr]||0)+n;

function roundResultHtml(){
  if(!roundResultOpen||!state)return '';
  const r=roundResultOpen;
  const hAfter=state.players.human.stars,cAfter=state.players.cpu.stars;
  const hBefore=(r.starAwarded&&r.winner==='human')?Math.max(0,hAfter-1):hAfter;
  const cBefore=(r.starAwarded&&r.winner==='cpu')?Math.max(0,cAfter-1):cAfter;
  const hStars=r.starAwarded&&r.winner==='human'?`${stars(hBefore)}<span class="round-result-arrow">→</span>${stars(hAfter)}`:stars(hAfter);
  const cStars=r.starAwarded&&r.winner==='cpu'?`${stars(cBefore)}<span class="round-result-arrow">→</span>${stars(cAfter)}`:stars(cAfter);
  const hWall=Number(r.humanWall||0), cWall=Number(r.cpuWall||0);
  const rawWinner=r.humanPower>r.cpuPower?'human':r.cpuPower>r.humanPower?'cpu':null;
  const loser=rawWinner?(rawWinner==='human'?'cpu':'human'):null;
  const loserWall=loser==='human'?hWall:loser==='cpu'?cWall:0;
  const wallApplied=Boolean(rawWinner&&loserWall>0);
  const wallSide=wallApplied?loser:null;
  const scoreText=side=>{
    const power=side==='human'?r.humanPower:r.cpuPower;
    const wall=side==='human'?hWall:cWall;
    return `${side==='human'?'YOU':'CPU'} ${power}${wallApplied&&wallSide===side?`(+${wall})`:''}`;
  };
  const cls=side=>{
    if(r.forcedDraw)return 'round-score-side--dim';
    if(wallSide===side)return 'round-score-side--wall';
    if(!rawWinner)return 'round-score-side--dim';
    if(r.wallBlocked)return 'round-score-side--dim';
    return rawWinner===side?'round-score-side--win':'round-score-side--dim';

  return `<div class="round-result-overlay" id="roundResultOverlay"><section class="legacy-modal ${tutorialRoundEnd?'legacy-modal--tutorial-result':''}" role="dialog" aria-modal="true"><span class="eyebrow">ROUND ${r.round} RESULT</span><div class="round-score-wrap"><div class="round-score-line"><span class="round-score-side ${cls('human')}">${scoreText('human')}</span><span class="round-score-dash">-</span><span class="round-score-side ${cls('cpu')}">${scoreText('cpu')}</span></div></div>${r.forcedDraw?'<div class="forced-draw-note">効果で引き分けになった</div>':''}<div class="round-result-star-lines"><div class="round-result-star-row"><span>YOU</span><span class="round-result-star-value">${hStars}</span></div><div class="round-result-star-row"><span>CPU</span><span class="round-result-star-value">${cStars}</span></div></div>${tutorialExplain||'<p class="tap-dismiss-note">画面をタップして続ける</p>'}</section></div>`;

function tutorialActionAllowed(a){
  if(!tutorialMode)return true;
  const human=state?.players?.human;
  if(!human)return false;
  if(tutorialStep===1||tutorialStep===2)return a?.kind==='draw';
  if(tutorialStep===3){
    const doratch=human.hand.find(c=>c.key==='doratch');
    return a?.kind==='summon'&&!!doratch&&a.cardId===doratch.id;
  }
  if(tutorialStep===8){
    const tokage=human.hand.find(c=>c.key==='tokage');
    return a?.kind==='summon'&&!!tokage&&a.cardId===tokage.id;
  }
  if(tutorialStep===9){
    const tokage=human.field.find(c=>c.key==='tokage');
    return a?.kind==='active'&&!!tokage&&a.cardId===tokage.id;
  }
  if(tutorialStep>=11)return true;
  return false;
}

function tutorialFilterLegal(actions){
  if(!tutorialMode)return actions;
  return (actions||[]).filter(tutorialActionAllowed);
}

function tutorialRefreshLegal(){
  const all=state?.currentSide==='human'&&!state?.gameOver?engine.getLegalActions('human'):[];
  legal=tutorialFilterLegal(all);
}

function tutorialTrackAction(a){
  if(!tutorialMode)return;
  const h=state?.players?.human;
  if(tutorialStep===1&&a?.kind==='draw'){
    tutorialStep=2;
  }else if(tutorialStep===2&&a?.kind==='draw'){
    tutorialStep=3;
  }else if(tutorialStep===3&&a?.kind==='summon'){
    const c=h?.field?.find(x=>x.id===a.cardId);
    if(c?.key==='doratch')tutorialStep=4;
  }else if(tutorialStep===8&&a?.kind==='summon'){
    const c=h?.field?.find(x=>x.id===a.cardId);
    if(c?.key==='tokage')tutorialStep=9;
  }else if(tutorialStep===9&&a?.kind==='active'){
    tutorialStep=10;
  }
}

async function tutorialCpuTurn(current){
  if(!tutorialMode||current?.currentSide!=='cpu')return false;
  const acts=engine.getLegalActions('cpu')||[];

  // Round 1: CPU does nothing but draw on all three turns.
  if(current.round===1){
    const draw=acts.find(a=>a.kind==='draw');
    if(!draw)throw new Error('チュートリアル：CPUのドロー行動を取得できませんでした。');
    await engine.applyAction(draw);
    return true;
  }

  // Round 2 first CPU turn: summon ヤドカリ opposite トカゲマル.
  if(current.round===2&&!current.players.cpu.field.some(c=>c.key==='hermit')){
    // CPU hand is hidden from getPublicState(), so identify the scripted card
    // from CPU's legal actions rather than current.players.cpu.hand.
    const summon=acts.find(a=>a.kind==='summon'&&a.cardKey==='hermit');
    if(summon){
      const tokage=current.players.human.field.find(c=>c.key==='tokage');
      await engine.applyAction({...summon,slot:tokage?.slot??1});
      return true;
    }
    throw new Error('チュートリアル：ヤドカリを場に出せませんでした。');
  }

  // Once the guided section is finished, normal AI takes over.
  await engine.playAiTurn('cpu');
  return true;
}

  }finally{busy=false;render();}
}

function setupHtml(){
  const normal=ATTRIBUTES.map(a=>`<option value="${a}">${ATTRIBUTE_LABELS[a]}</option>`).join('');
  const options=`${normal}<option value="ai_special">★ AIスペシャル</option><option value="custom">カスタムデッキ</option>`;
  return `<main class="setup-shell"><section class="setup-card">
    <div class="brand-lockup"><span class="brand-kicker">PHASE 1 · v45 UI</span><h1>STAR DUEL</h1></div>
    <div class="setup-grid setup-grid--compact">
      <label><span>あなたのデッキ</span><select id="humanAttr">${options}</select></label>
      <label><span>CPUデッキ</span><select id="cpuAttr">${options}</select></label>
      <label><span>先攻</span><select id="starter"><option value="human">あなた</option><option value="cpu">CPU</option></select></label>
    </div>
    ${customDeckEditor('human')}
    ${customDeckEditor('cpu')}
    <details class="deck-code-help"><summary>デッキコードについて</summary>
      <p><code>カードID:枚数</code> の羅列です。例：<code>researcher:3,penguin:3,marilyn:3</code></p>
      <p>存在しないID、1種類4枚以上、合計30枚以外は対戦開始時にエラーになります。</p>
      <p><strong>AIスペシャル:</strong> <code>${AI_SPECIAL_CODE}</code></p>
    </details>
    ${notice&&notice!=='デッキを選んで対戦を始めてください。'?`<div class="setup-notice">${esc(notice)}</div>`:''}
    <div class="setup-actions">
      <button type="button" class="primary-button primary-button--large" id="startGame" ${busy?'disabled':''}>${busy?'準備中…':'対戦を始める'}</button>
      <div class="setup-subnav">
        <button type="button" class="secondary-button catalog-open-button" id="openCatalog">カード一覧</button>
        <button type="button" class="secondary-button" id="openPlayGuide">遊び方</button>
      </div>
    </div>
    <div class="debug-seed-wrap">
      <label class="debug-seed"><span>DEBUG · Seed</span><input id="debugSeed" inputmode="numeric" autocomplete="off" placeholder="auto" value="${esc(config.debugSeed||'')}"></label>
    </div>
  </section>${playGuideModalHtml()}${glossaryModalHtml()}</main>`;
}
function catalogHtml(){
  const catalog=engine.getCardCatalog();
  const order=CATALOG_CARD_ORDER[catalogAttr]||[];
  const orderIndex=new Map(order.map((name,i)=>[name,i]));
  const cards=catalog.filter(c=>c.attr===catalogAttr).sort((a,b)=>{
    const ai=orderIndex.has(a.name)?orderIndex.get(a.name):9999;
    const bi=orderIndex.has(b.name)?orderIndex.get(b.name):9999;
    return ai-bi || a.level-b.level || a.name.localeCompare(b.name,'ja');
  });
  const options=ATTRIBUTES.map(a=>`<option value="${a}" ${a===catalogAttr?'selected':''}>${ATTRIBUTE_LABELS[a]}</option>`).join('');
  const groups=[1,2,3,4].map(level=>{
    const levelCards=cards.filter(c=>c.level===level);
    if(!levelCards.length)return '';
    const list=levelCards.map(c=>`<div class="catalog-card-wrap" data-catalog-key="${esc(c.key)}" role="button" tabindex="0" aria-label="${esc(c.name)}の詳細を見る">${cardView(c,{compact:false})}</div>`).join('');
    return `<section class="catalog-level-group" data-level="${level}"><div class="catalog-grid">${list}</div></section>`;
  }).join('');
  const detail=catalogDetailKey?catalog.find(c=>c.key===catalogDetailKey):null;
  const detailOverlay=detail?`<div class="catalog-detail-overlay" id="catalogDetailOverlay"><section class="catalog-detail-sheet" role="dialog" aria-modal="true"><div class="catalog-detail-meta"><strong>${esc(ATTRIBUTE_LABELS[detail.attr])}</strong><span>×${detail.copies}</span></div>${cardView(detail,{compact:false})}<p class="tap-dismiss-note">枠外をタップして閉じる</p></section></div>`:'';
  return `<main class="catalog-shell"><header class="catalog-header"><button type="button" class="secondary-button" id="closeCatalog">← メニュー</button><div><span class="brand-kicker">CARD LIST</span><h2>カード一覧</h2></div></header><section class="catalog-toolbar"><label>属性 <select id="catalogAttr">${options}</select></label><span>${cards.length}種類</span></section>${groups}${detailOverlay}</main>`;
}

function battleLogHtml(){
  const runtimeLogs=engine.getLogs ? engine.getLogs() : [];
  const logs=Array.isArray(runtimeLogs)&&runtimeLogs.length?runtimeLogs:(Array.isArray(state?.logs)?state.logs:[]);
  const rows=logs.length?[...logs].reverse().map(t=>`<div class="battle-log__entry">${esc(t)}</div>`).join(''):'<div class="battle-log__empty">まだログはありません。</div>';
  return `<section class="battle-log"><div class="battle-log__head"><strong>BATTLE LOG</strong><span>${logs.length}件・最新が上</span></div><div class="battle-log__body">${rows}</div></section>`;
}
function gameHtml(){
  const h=state.players.human,c=state.players.cpu;
  const selectedCard=h.hand?.find(c=>c.id===selectedHandId)||null;
  const selectedSummon=selectedCard?action('summon',selectedCard.id):null;
  const selectedSpell=selectedCard?action('spell',selectedCard.id):null;
  const hand=(h.hand||[]).map(card=>{
    const summon=action('summon',card.id), spell=action('spell',card.id), playable=Boolean(summon||spell);
    const inlineTarget=Boolean(inlineChoice?.kind==='card'&&inlineChoice.zone==='hand'&&inlineHasValue(card.id));
    const html=cardView(card,{selectable:playable||inlineTarget,selected:selectedHandId===card.id,disabled:inlineChoice?!inlineTarget:(!playable||busy)});
    return `<div class="hand-card-wrap${inlineTarget?' hand-card-wrap--effect-target':''}" ${inlineTarget?`data-inline-card="${card.id}"`:(playable&&!busy?`data-hand-id="${card.id}"`:'')}>${html}</div>`;
  }).join('');
  return `<main class="game-shell">
    <header class="game-topbar"><div><span class="brand-kicker">v24 ROBUST LEAGUE</span><strong>Round ${state.round}</strong></div><button type="button" class="secondary-button" id="newGame">新しい対戦</button></header>
    <div class="battle-layout">
      ${playerHeader(c,true)}
      ${turnHud()}
      ${tutorialPanelHtml()}
      ${inlineChoiceBanner('board')}
      <section class="board${inlineChoice?.where==='board'?' inline-choice-mode':''}">
        <div class="field-row field-row--opponent">${deckHud(c,'cpu')}${fieldSlots('cpu','above')}${powerHud(c)}</div>
        <div class="field-row field-row--human">${powerHud(h)}${fieldSlots('human','below')}${deckHud(h,'human')}</div>
      </section>
      <section class="action-zone${inlineChoice?.where==='hand'?' inline-choice-mode':''}">${inlineChoiceBanner('hand')}<div class="action-zone__head"><div><span class="eyebrow">YOUR HAND</span><h3>手札</h3></div><div class="hand-action-buttons">${selectedSpell?`<button type="button" class="hand-spell-button" id="handSpell" ${busy?'disabled':''}>呪文を唱える</button>`:''}<button type="button" class="hand-draw-button" id="handDraw" ${(!action('draw')||busy)?'disabled':''}><span class="draw-card-icon"></span><span>1枚ドロー</span></button></div></div>
        <div class="hand-scroll">${hand}</div>
      </section>
      ${playerHeader(h,false)}
      ${battleLogHtml()}
    </div>
    <div id="modalLayer">${modalHtml()}</div>
    ${state.gameOver?`<div class="result-overlay"><section class="result-card"><span class="brand-kicker">GAME SET</span><h2>${state.winner==='human'?'YOU WIN':'CPU WIN'}</h2><p>${h.stars} - ${c.stars} / Round ${state.round}</p><button type="button" class="primary-button" id="playAgain">もう一度遊ぶ</button></section></div>`:''}
  </main>`;
}
function render(){
  root.innerHTML=showCatalog?catalogHtml():((!state||showSetup)?setupHtml():gameHtml());
  bind();
}
function bind(){
  if(showCatalog){
    document.getElementById('closeCatalog')?.addEventListener('click',()=>{catalogDetailKey=null;showCatalog=false;render();});
    document.getElementById('catalogAttr')?.addEventListener('change',e=>{catalogDetailKey=null;catalogAttr=e.target.value;render();});
    document.querySelectorAll('[data-catalog-key]').forEach(el=>{
      const open=()=>{catalogDetailKey=el.dataset.catalogKey;render();};
      el.addEventListener('click',open);
      el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
    });
    document.getElementById('catalogDetailOverlay')?.addEventListener('click',e=>{if(e.target.id==='catalogDetailOverlay'){catalogDetailKey=null;render();}});
    return;
  }
  if(!state||showSetup){
    const ha=document.getElementById('humanAttr'),ca=document.getElementById('cpuAttr'),st=document.getElementById('starter');
    if(ha){ha.value=config.humanAttribute;ha.onchange=e=>{config.humanAttribute=e.target.value;notice='';render();};}
    if(ca){ca.value=config.cpuAttribute;ca.onchange=e=>{config.cpuAttribute=e.target.value;notice='';render();};}
    if(st){st.value=config.starter;st.onchange=e=>config.starter=e.target.value;}
    const hcc=document.getElementById('humanCustomCode'),ccc=document.getElementById('cpuCustomCode'),ds=document.getElementById('debugSeed');
    if(hcc)hcc.oninput=e=>config.humanCustomCode=e.target.value;
    if(ccc)ccc.oninput=e=>config.cpuCustomCode=e.target.value;
    if(ds)ds.oninput=e=>config.debugSeed=e.target.value.replace(/[^\d]/g,'').slice(0,10);
    document.getElementById('openCatalog')?.addEventListener('click',()=>{showCatalog=true;catalogAttr=ATTRIBUTES.includes(config.humanAttribute)?config.humanAttribute:'dragon';render();});
    document.getElementById('startGame')?.addEventListener('click',startGame);
    document.getElementById('openPlayGuide')?.addEventListener('click',()=>{helpModal='guide';render();});
    document.getElementById('guideTutorial')?.addEventListener('click',()=>{helpModal=null;startTutorial();});
    document.getElementById('guideGlossary')?.addEventListener('click',()=>{helpModal='glossary';render();});
    document.getElementById('closeHelp')?.addEventListener('click',()=>{helpModal=null;render();});
    document.getElementById('helpOverlay')?.addEventListener('click',e=>{if(e.target.id==='helpOverlay'){helpModal=null;render();}});
    return;
  }
  document.getElementById('newGame')?.addEventListener('click',()=>{tutorialMode=false;showSetup=true;selectedHandId=null;graveOpenSide=null;detailCard=null;notice='デッキを選んで対戦を始めてください。';render();});
  document.getElementById('playAgain')?.addEventListener('click',()=>{tutorialMode=false;showSetup=true;graveOpenSide=null;detailCard=null;notice='デッキを選んで対戦を始めてください。';render();});
  document.getElementById('tutorialNext')?.addEventListener('click',()=>{
    if(tutorialStep===0)tutorialStep=1;
    else if(tutorialStep===6)tutorialStep=7;
    else if(tutorialStep===7)tutorialStep=8;
    else if(tutorialStep===10)tutorialStep=11;
    tutorialRefreshLegal();
    render();
  });
  document.getElementById('tutorialFinish')?.addEventListener('click',async()=>{
    tutorialMode=false;notice='基本ルールの説明は以上です。自由にプレイしてください。';
    legal=state?.currentSide==='human'&&!state?.gameOver?engine.getLegalActions('human'):[];
    render();
    if(state?.currentSide==='cpu'&&!state?.gameOver)await runCpuTurns();
  });
  document.getElementById('tutorialExit')?.addEventListener('click',()=>{tutorialMode=false;showSetup=true;state=null;selectedHandId=null;notice='デッキを選んで対戦を始めてください。';render();});
  document.getElementById('handDraw')?.addEventListener('click',()=>perform({kind:'draw',side:'human'}));
  document.getElementById('handSpell')?.addEventListener('click',()=>{if(selectedHandId!=null&&action('spell',selectedHandId))perform({kind:'spell',side:'human',cardId:selectedHandId});});
  document.getElementById('inlineChoiceCancel')?.addEventListener('click',e=>{e.stopPropagation();resolveInlineChoice(null);});
  document.querySelectorAll('[data-inline-card]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();resolveInlineChoice(Number(el.dataset.inlineCard));}));
  document.querySelectorAll('[data-inline-slot]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();resolveInlineChoice(Number(el.dataset.inlineSlot));}));
  document.querySelectorAll('[data-grave-side]').forEach(el=>el.addEventListener('click',()=>{if(busy)return;detailCard=null;graveOpenSide=el.dataset.graveSide;renderModalLayer();}));
  document.querySelectorAll('[data-card-detail-side]').forEach(el=>{
    const open=()=>{if(busy)return;graveOpenSide=null;detailCard={side:el.dataset.cardDetailSide,cardId:Number(el.dataset.cardDetailId),zone:el.dataset.cardDetailZone||'field'};renderModalLayer();};
    el.addEventListener('click',e=>{e.stopPropagation();open();});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  });
  document.querySelectorAll('[data-hand-id]').forEach(el=>el.addEventListener('click',()=>{
    const id=Number(el.dataset.handId);selectedHandId=selectedHandId===id?null:id;render();
  }));
  document.querySelectorAll('[data-slot]').forEach(el=>el.addEventListener('click',()=>{
    if(selectedHandId==null)return;perform({kind:'summon',side:'human',cardId:selectedHandId,slot:Number(el.dataset.slot)});
  }));
  document.querySelectorAll('[data-action-kind]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();const kind=el.dataset.actionKind,id=Number(el.dataset.actionId);perform({kind,side:'human',cardId:id});
    });
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click();}});
  });  bindModal();
}

globalThis.__v24CpuActionPause=async isRoundEnd=>{
  const snapshot=engine.getPublicState();
  if(snapshot){state=snapshot;state.logs=engine.getLogs?engine.getLogs():(state.logs||[]);}
  legal=[];render();
  await wait(isRoundEnd?850:420);
};

function resolveDebugSeed(){
  const raw=String(config.debugSeed??'').trim();
  if(!raw)return null;
  if(!/^\d+$/.test(raw))throw new Error('Debug Seed は0〜4294967295の整数で入力してください。');
  const n=Number(raw);
  if(!Number.isSafeInteger(n)||n<0||n>0xffffffff)throw new Error('Debug Seed は0〜4294967295の整数で入力してください。');
  return n>>>0;
}
async function startGame(){
  if(busy)return;tutorialMode=false;helpModal=null;busy=true;notice='対戦を準備しています…';render();
  try{
    const debugSeed=resolveDebugSeed();
    config.seed=debugSeed==null?(globalThis.crypto?.getRandomValues?globalThis.crypto.getRandomValues(new Uint32Array(1))[0]:Math.floor(Math.random()*0x100000000))>>>0:debugSeed;
    const humanDeck=resolveDeckSelection('human'),cpuDeck=resolveDeckSelection('cpu');
    const startConfig={...config,humanAttribute:humanDeck.attr,cpuAttribute:cpuDeck.attr,humanDeckSpec:humanDeck.spec,cpuDeckSpec:cpuDeck.spec,humanDeckLabel:humanDeck.label,cpuDeckLabel:cpuDeck.label};
    const next=await engine.start(startConfig);state=next;showSetup=false;selectedHandId=null;graveOpenSide=null;detailCard=null;engineChoice=null;inlineChoice=null;inlineChoiceResolve=null;engineInfo=null;roundResultOpen=null;lastRoundResultSeen=0;legal=next?.currentSide==='human'?engine.getLegalActions('human'):[];notice=next?.currentSide==='human'?'あなたのターンです。':'CPUが考えています…';render();
    if(next?.currentSide==='cpu')await runCpuTurns();
  }catch(err){
    console.error(err);
    notice=err?.message||String(err);
  }
  finally{busy=false;render();}
}
async function perform(a){
  if(busy||!state||state.gameOver)return;
  if(tutorialMode&&!tutorialActionAllowed(a)){notice='今はチュートリアルで案内されている操作をしてください。';render();return;}
  graveOpenSide=null;detailCard=null;busy=true;render();
  try{
    await engine.applyAction(a);selectedHandId=null;
    const nextBeforeTrack=sync();
    tutorialTrackAction(a);
    tutorialRefreshLegal();
    const next=sync();
    if(next?.gameOver)notice=next.winner==='human'?'あなたの勝利！':'CPUの勝利';
    else if(roundResultOpen)notice=`ラウンド${roundResultOpen.round}終了`;
    else if(tutorialMode&&tutorialStep===10){
      notice='トカゲマルの起動効果でヤドカリを破壊しました。';
    }else if(next?.currentSide==='cpu'){
      await runCpuTurns();
    }else notice='続けて行動できます。';
  }catch(err){notice=err?.message||String(err);}
  finally{busy=false;sync();}
}
async function runCpuTurns(){
  let current=engine.getPublicState(),guard=0;
  while(current?.currentSide==='cpu'&&!current.gameOver&&guard++<8){
    notice=tutorialMode?'チュートリアル：CPUの手番です。':'CPUが考えています…';
    render();await wait(tutorialMode?180:300);
    if(tutorialMode)await tutorialCpuTurn(current);
    else await engine.playAiTurn('cpu');
    current=sync();
    if(roundResultOpen)break;
    // Guided Tokage section pauses immediately after the scripted Yadokari.
    if(tutorialMode&&tutorialStep===9&&current?.currentSide==='human')break;
    await wait(tutorialMode?120:240);
  }
  if(current?.gameOver)notice=current.winner==='human'?'あなたの勝利！':'CPUの勝利';
  else if(current?.currentSide==='human'){
    if(tutorialMode){
      if(tutorialStep===2)notice='相手も1枚ドローしました。';
      else if(tutorialStep===3)notice='相手はまた1枚ドローしました。';
      else if(tutorialStep===4)notice='第1ラウンドが終了しました。';
      else if(tutorialStep===9)notice='CPUはヤドカリを場に出しました。';
      else notice='あなたの手番です。';
    }else notice='あなたのターンです。';
  }
  render();
}
render();
